<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Signal — Live Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    header .tag {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      background: #1c2028;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* ---- Accuracy hero ---- */
    .hero {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hero-left .label {
      font-size: 13px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }
    .hero-left .value {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1;
    }
    .hero-left .value.good { color: #3fb950; }
    .hero-left .value.mid  { color: #d29922; }
    .hero-left .value.bad  { color: #f85149; }
    .hero-left .value.na   { color: #484f58; }
    .hero-right {
      text-align: right;
      font-size: 13px;
      color: #8b949e;
      line-height: 1.7;
    }
    .hero-right span { color: #e1e4e8; font-weight: 500; }

    /* ---- Signals ---- */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8b949e;
      margin-bottom: 14px;
    }
    .signals-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .signal-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 16px;
      transition: border-color 0.15s;
    }
    .signal-card:hover { border-color: #388bfd44; }

    .confidence-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .confidence-badge.high { background: #0d2818; color: #3fb950; border: 2px solid #238636; }
    .confidence-badge.mid  { background: #2d1e00; color: #d29922; border: 2px solid #9e6a03; }
    .confidence-badge.low  { background: #2d1315; color: #f85149; border: 2px solid #da3633; }

    .signal-body { min-width: 0; }
    .signal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .market-tag {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #79c0ff;
      background: #0d2239;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .selection { font-weight: 600; font-size: 15px; }
    .odds { color: #8b949e; font-size: 13px; }
    .direction {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .direction.shortening { background: #0d2818; color: #3fb950; }
    .direction.drifting   { background: #2d1315; color: #f85149; }
    .reason {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.5;
      margin-top: 4px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-badge.pending   { background: #1c2028; color: #8b949e; }
    .status-badge.correct   { background: #0d2818; color: #3fb950; }
    .status-badge.incorrect { background: #2d1315; color: #f85149; }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: #484f58;
      font-size: 15px;
    }
    .empty-state .icon { font-size: 32px; margin-bottom: 12px; display: block; }

    /* ---- Footer ---- */
    footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #21262d;
      font-size: 12px;
      color: #484f58;
      display: flex;
      justify-content: space-between;
    }
    #last-updated { color: #8b949e; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sharp Signal</h1>
      <span class="tag">Live</span>
    </header>

    <div class="hero">
      <div class="hero-left">
        <div class="label">Overall Accuracy</div>
        <div class="value na" id="accuracy-value">—</div>
      </div>
      <div class="hero-right">
        <div>Signals analysed: <span id="total-resolved">0</span></div>
        <div>Correct: <span id="correct-count">0</span></div>
        <div>Incorrect: <span id="incorrect-count">0</span></div>
      </div>
    </div>

    <div class="section-title">Recent Signals</div>
    <div class="signals-list" id="signals-list">
      <div class="empty-state">
        <span class="icon">📡</span>
        Waiting for first signal…
      </div>
    </div>

    <footer>
      <span>Sharp Signal v0.1</span>
      <span id="last-updated"></span>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function accuracyClass(pct) {
      if (pct === null || pct === undefined) return 'na';
      if (pct >= 60) return 'good';
      if (pct >= 40) return 'mid';
      return 'bad';
    }

    function confClass(c) {
      if (c >= 75) return 'high';
      if (c >= 55) return 'mid';
      return 'low';
    }

    function statusLabel(s) {
      if (s === 'pending') return 'Pending';
      if (s === 'correct') return 'Correct';
      return 'Incorrect';
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return `${Math.floor(diff)}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      return `${Math.floor(diff / 3600)}h ago`;
    }

    function renderSignals(signals) {
      const el = $('signals-list');
      if (!signals.length) {
        el.innerHTML = `
          <div class="empty-state">
            <span class="icon">📡</span>
            Waiting for first signal…
          </div>`;
        return;
      }
      el.innerHTML = signals.map(s => `
        <div class="signal-card">
          <div class="confidence-badge ${confClass(s.confidence)}">
            ${Math.round(s.confidence)}
          </div>
          <div class="signal-body">
            <div class="signal-meta">
              <span class="market-tag">${s.market}</span>
              <span class="selection">${s.selection}</span>
              <span class="odds">@ ${s.odds_value.toFixed(2)}</span>
              <span class="direction ${s.direction}">${s.direction}</span>
            </div>
            <div class="reason">${s.reason}</div>
          </div>
          <span class="status-badge ${s.status}">${statusLabel(s.status)}</span>
        </div>
      `).join('');
    }

    function renderAccuracy(data) {
      const pct = data.overall_accuracy_pct;
      const el = $('accuracy-value');
      el.textContent = pct > 0 ? `${pct.toFixed(1)}%` : '—';
      el.className = `value ${accuracyClass(pct)}`;
      $('total-resolved').textContent = data.total_resolved;
      $('correct-count').textContent = data.correct;
      $('incorrect-count').textContent = data.incorrect;
    }

    async function refresh() {
      try {
        const [sigRes, accRes] = await Promise.all([
          fetch('/signals?limit=20'),
          fetch('/accuracy'),
        ]);
        const sigData = await sigRes.json();
        const accData = await accRes.json();
        renderSignals(sigData.signals || []);
        renderAccuracy(accData);
        $('last-updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        console.error('Refresh failed:', e);
      }
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
